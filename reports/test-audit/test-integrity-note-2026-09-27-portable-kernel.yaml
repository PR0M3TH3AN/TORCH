test_integrity_note:
  change_type:
    - new_tests
  scenarios:
    - id: SCN-init-read-only
      given: a normal Git repository with committed project files
      when: TORCH inspects and analyzes it or produces an installation plan
      then: no project or machine-local TORCH state is created and Git status is unchanged
    - id: SCN-install-doctor-purge
      given: a reviewed fresh installation into a Git repository
      when: TORCH installs, diagnoses, and purges its unchanged state
      then: doctor reports healthy, all owned TORCH state is removed, and project source remains unchanged
    - id: SCN-purge-protects-user-change
      given: an installed TORCH project whose managed configuration was edited by its owner
      when: a purge is requested
      then: TORCH refuses destructive cleanup and preserves the modified file
    - id: SCN-cli-install-approval
      given: a Git repository without TORCH
      when: install is invoked without a reviewed approval flag
      then: the command refuses and creates no TORCH state
    - id: SCN-domain-approval
      given: a generated organizational proposal that is pending or stale
      when: TORCH is asked to install it
      then: installation refuses before creating tracked or local state
    - id: SCN-cli-domain-review
      given: a Git repository analyzed through the public CLI
      when: the owner generates, reviews, approves, and installs its domain proposal
      then: pending proposals are rejected and the approved proposal becomes durable project state
    - id: SCN-domain-collision
      given: frontend and backend components that both consume a shared contract plus cross-cutting tests
      when: TORCH builds the architecture graph and domain proposal
      then: it proposes persistent component domains and QA, links import evidence, and records neighboring-domain collisions requiring an explicit resolution
    - id: SCN-worktree-bootstrap
      given: an approved TORCH organization committed to a clean main branch
      when: the owner previews and creates its managed worktrees
      then: every persistent identity receives the intended branch and external worktree, task markers are ignored, and repeated planning is idempotent
    - id: SCN-worktree-purge-safety
      given: a TORCH-managed domain worktree containing uncommitted or uniquely committed work
      when: project purge is requested
      then: TORCH identifies the exact unsafe worktree, refuses removal, and preserves the work
    - id: SCN-worktree-collision
      given: a configured fleet branch already exists outside the approved worktree mapping
      when: worktree creation is previewed or requested
      then: TORCH reports the exact branch collision and creates no partial fleet
    - id: SCN-durable-message
      given: direct and group messages queued for persistent Fleet identities
      when: the control-plane process closes, reopens, reads, and acknowledges them
      then: messages and references survive restart and only addressed identities can acknowledge them
    - id: SCN-identity-presence-authority
      given: one stable Fleet identity across replacement Claude runtime sessions
      when: presence and runtime IDs change or a forged identity attempts a mutation
      then: the area identity remains stable, the current runtime mapping is live, and forged actors are rejected
    - id: SCN-local-state-path-safety
      given: a repository-edited installation manifest pointing local state at another directory
      when: the control plane attempts to open its SQLite database
      then: it rejects the path mismatch before creating or modifying a database there
    - id: SCN-ownership-handoff
      given: an approved path owner requesting a handoff
      when: the request is recorded and routed to the Session Manager
      then: the request is durable but approved ownership does not change implicitly
    - id: SCN-cli-control-plane
      given: an installed project using no MCP-capable runtime
      when: an agent sends, reads, acknowledges, reports status, and queries ownership through CLI
      then: each operation observes the same durable control-plane state
    - id: SCN-mcp-parity
      given: the provider-independent control-plane service
      when: all specified MCP tools invoke it
      then: the complete tool surface uses the same validation, ownership, and durable message semantics
    - id: SCN-mcp-stdio
      given: an installed TORCH project and an MCP host process
      when: the host performs the initialize handshake and lists tools over stdio
      then: the official MCP transport identifies TORCH and advertises the exact 14-tool contract
    - id: SCN-claude-adapter
      given: a Claude runtime adapter with a virtualized command runner
      when: sessions are planned and runtime state is queried
      then: command construction is deterministic, capabilities are explicit, and planning launches no process
    - id: SCN-fleet-fresh-resume
      given: approved identities and managed worktrees with a virtualized Claude executor
      when: the fleet starts fresh, winds down safely, and plans its next start
      then: workers start before the manager, runtime IDs persist, the manager stops last, and the next start resumes
    - id: SCN-fleet-wind-down-safety
      given: a launch failure or a domain reporting active work
      when: startup or wind-down is attempted
      then: manager launch is prevented after worker failure and active work blocks shutdown
  observable_outcomes:
    - Git status before and after read-only analysis
    - presence or absence of .torch and XDG-local project state
    - doctor health and finding codes
    - CLI exit status and structured error code
    - proposal review status, repository commit binding, and generated domain count
    - preservation of project source and modified owner configuration
    - SQLite state after process restart
    - CLI and MCP output over real process boundaries
    - runtime command plans and execution order
    - local resume snapshot and presence transitions
  determinism_controls:
    - isolated temporary Git repositories
    - fixed test Git identity
    - fixed installation timestamp where content is asserted
    - per-fixture XDG_DATA_HOME
    - injected UUID sequence and clock where ordering matters
    - virtualized Claude command runner with no provider calls
    - local stdio MCP child process with bounded response timeout
  anti_cheat_rationale:
    prevents:
      - init that silently writes files
      - installer that overwrites existing state
      - doctor that reports healthy without required state
      - uninstall that deletes owner-modified configuration
      - CLI that mutates without explicit approval
      - in-memory-only messaging that disappears on restart
      - runtime session IDs masquerading as durable Fleet identities
      - messages or handoffs silently granting authority
      - repository content redirecting machine-local database writes
      - MCP and CLI drifting onto separate business logic
      - launch plans that execute provider commands during preview
      - manager-first startup or manager-first shutdown
  relaxation:
    did_relax_any_assertion: false
    if_true_explain_spec_basis: ""
