test_integrity_note:
  change_type:
    - new_tests
  scenarios:
    - id: SCN-init-read-only
      given: a normal Git repository with committed project files
      when: TORCH inspects and analyzes it or produces an installation plan
      then: no project or machine-local TORCH state is created and Git status is unchanged
    - id: SCN-install-doctor-purge
      given: a reviewed fresh installation into a Git repository
      when: TORCH installs, diagnoses, and purges its unchanged state
      then: doctor reports healthy, all owned TORCH state is removed, and project source remains unchanged
    - id: SCN-purge-protects-user-change
      given: an installed TORCH project whose managed configuration was edited by its owner
      when: a purge is requested
      then: TORCH refuses destructive cleanup and preserves the modified file
    - id: SCN-cli-install-approval
      given: a Git repository without TORCH
      when: install is invoked without a reviewed approval flag
      then: the command refuses and creates no TORCH state
    - id: SCN-domain-approval
      given: a generated organizational proposal that is pending or stale
      when: TORCH is asked to install it
      then: installation refuses before creating tracked or local state
    - id: SCN-config-schema
      given: an installed Fleet configuration and malformed or future configuration variants
      when: TORCH validates or plans migration of the configuration
      then: the current schema passes, safety invariants and unknown fields fail clearly, and unsupported versions receive an explicit migration blocker
    - id: SCN-cli-domain-review
      given: a Git repository analyzed through the public CLI
      when: the owner generates, reviews, approves, and installs its domain proposal
      then: pending proposals are rejected and the approved proposal becomes durable project state
    - id: SCN-domain-collision
      given: frontend and backend components that both consume a shared contract plus cross-cutting tests
      when: TORCH builds the architecture graph and domain proposal
      then: it proposes persistent component domains and QA, links import evidence, and records neighboring-domain collisions requiring an explicit resolution
    - id: SCN-worktree-bootstrap
      given: an approved TORCH organization committed to a clean main branch
      when: the owner previews and creates its managed worktrees
      then: every persistent identity receives the intended branch and external worktree, task markers are ignored, and repeated planning is idempotent
    - id: SCN-worktree-purge-safety
      given: a TORCH-managed domain worktree containing uncommitted or uniquely committed work
      when: project purge is requested
      then: TORCH identifies the exact unsafe worktree, refuses removal, and preserves the work
    - id: SCN-worktree-collision
      given: a configured fleet branch already exists outside the approved worktree mapping
      when: worktree creation is previewed or requested
      then: TORCH reports the exact branch collision and creates no partial fleet
    - id: SCN-durable-message
      given: direct and group messages queued for persistent Fleet identities
      when: the control-plane process closes, reopens, reads, and acknowledges them
      then: messages and references survive restart and only addressed identities can acknowledge them
    - id: SCN-identity-presence-authority
      given: one stable Fleet identity across replacement Claude runtime sessions
      when: presence and runtime IDs change or a forged identity attempts a mutation
      then: the area identity remains stable, the current runtime mapping is live, and forged actors are rejected
    - id: SCN-local-state-path-safety
      given: a repository-edited installation manifest pointing local state at another directory
      when: the control plane attempts to open its SQLite database
      then: it rejects the path mismatch before creating or modifying a database there
    - id: SCN-ownership-handoff
      given: an approved path owner requesting a handoff
      when: the request is recorded and routed to the Session Manager
      then: the request is durable but approved ownership does not change implicitly
    - id: SCN-cli-control-plane
      given: an installed project using no MCP-capable runtime
      when: an agent sends, reads, acknowledges, reports status, and queries ownership through CLI
      then: each operation observes the same durable control-plane state
    - id: SCN-cli-backlog
      given: an installed fleet with Session Manager and worker worktrees
      when: public CLI commands create, ready, assign, and list a tracked task
      then: revisioned backlog state changes in the manager worktree and the assigned owner is visible through the same service
    - id: SCN-cli-self-host
      given: two isolated candidate artifacts with complete named acceptance evidence
      when: an owner plans, builds, activates, upgrades, and rolls back through the CLI
      then: build and pointer changes require approval, staging does not activate code, and rollback restores the exact prior version
    - id: SCN-mcp-parity
      given: the provider-independent control-plane service
      when: all specified MCP tools invoke it
      then: the complete tool surface uses the same validation, ownership, and durable message semantics
    - id: SCN-mcp-stdio
      given: an installed TORCH project and an MCP host process
      when: the host performs the initialize handshake and lists tools over stdio
      then: the official MCP transport identifies TORCH and advertises the complete configured tool contract
    - id: SCN-claude-adapter
      given: a Claude runtime adapter with a virtualized command runner
      when: sessions are planned and runtime state is queried
      then: command construction is deterministic, capabilities are explicit, and planning launches no process
    - id: SCN-codex-adapter
      given: a Codex runtime adapter with a virtualized command runner and an identity-bound TORCH control plane
      when: create, resume, MCP configuration, runtime-ID capture, and steering are planned or attempted
      then: no provider call occurs, thread IDs come from JSONL, every message is durable, and unsupported native controls fail explicitly
    - id: SCN-fleet-fresh-resume
      given: approved identities and managed worktrees with a virtualized Claude executor
      when: the fleet starts fresh, winds down safely, and plans its next start
      then: workers start before the manager, runtime IDs persist, the manager stops last, and the next start resumes
    - id: SCN-fleet-wind-down-safety
      given: a launch failure or a domain reporting active work
      when: startup or wind-down is attempted
      then: manager launch is prevented after worker failure and active work blocks shutdown
    - id: SCN-mixed-runtime
      given: one approved Codex worker domain and one Claude Session Manager with stable Fleet identities
      when: the mixed fleet starts and winds down through virtualized runtime boundaries
      then: provider-specific commands and runtime IDs remain separate, the manager starts last, Codex completes idle, and only resident processes are stopped
    - id: SCN-backlog-lifecycle
      given: tracked tasks in the Session Manager worktree with domain owners, dependencies, and an integration lookup
      when: tasks move through assignment, work, blocking, verification, readiness, landing, and completion
      then: authority and optimistic revisions are enforced, concurrent locks fail closed, dependencies gate assignment, doctor observes active work, and completion requires the same landed commit
    - id: SCN-candidate-isolation
      given: an inactive candidate in a namespace separate from project and stable runtime state
      when: acceptance is incomplete, complete, or the accepted files are later modified
      then: incomplete staging is removed, successful staging stays inactive, read-only status writes nothing, and stale validation blocks activation
    - id: SCN-atomic-upgrade-rollback
      given: accepted forward-and-rollback-compatible versions installed side by side
      when: activation is interrupted after the atomic pointer swap and the service restarts
      then: the journal reconciles to the exact active version and rollback restores the previous pointer without rewriting project state
    - id: SCN-exact-sha-checks
      given: approved shell-free checks and a clean managed worktree
      when: passing, failing, and dirty-input checks are requested
      then: receipts name the exact commit, failures remain failures, and dirty inputs are refused
    - id: SCN-resource-fifo
      given: two Fleet identities competing for a capacity-one browser resource
      when: they acquire, queue, release, expire, and cancel
      then: FIFO order is preserved, stale leases remain visible without being stolen, and cancellation leaks nothing
    - id: SCN-native-integration
      given: a converged domain commit with every required exact-SHA receipt
      when: the domain requests integration and the Session Manager authorizes and lands it
      then: main fast-forwards only while source, target, receipts, cleanliness, and authority remain valid
    - id: SCN-local-canonical
      given: an installed project with no forge or remote
      when: the owner creates a local canonical Git store and later makes and pushes another commit
      then: TORCH distinguishes one-disk from local-remote recoverability without claiming off-machine backup
    - id: SCN-combatrig-import
      given: a legacy COMBATRIG fleet with prompts, worktree mappings, backlog, checks, and schedules
      when: TORCH analyzes it through the compatibility service
      then: source state is unchanged, observed evidence is preserved, and missing ownership blocks approval
    - id: SCN-cli-combatrig-import
      given: the same legacy fleet selected through the public CLI
      when: a compatibility report is requested outside the source repository
      then: the report is written, the command returns blocking status, and the source remains unchanged
    - id: SCN-spec-fleet-design
      given: a new Git project shell and an external prose product specification
      when: TORCH analyzes and proposes its persistent project domains
      then: project-specific responsibilities and evidence are retained while nonexistent path ownership remains unresolved
    - id: SCN-cli-spec-design
      given: a caller outside a selected Git repository with an external specification
      when: torch design is invoked with explicit repo and spec paths
      then: a pending project-specific proposal is produced without creating TORCH state in the project
    - id: SCN-ai-fleet-bootstrap
      given: a mixed repository and an external prose specification
      when: torch bootstrap prepares the provider-independent Session Architect input
      then: repository evidence, omitted components, unmatched specification signals, trust boundaries, and the pending output contract remain explicit without mutating the project
    - id: SCN-ai-fleet-planning
      given: a bounded design brief and an explicitly selected planning provider
      when: TORCH previews, executes through a virtualized provider, parses, and validates the returned proposal
      then: planning remains read-only, execution requires authorization, provenance and evidence remain fixed, invented ownership and self-approval are rejected, and owner review remains required
    - id: SCN-fleet-evolution
      given: an installed Fleet whose Session Manager identifies recurring work without a coherent owner
      when: it proposes a durable domain and the owner explicitly approves activation
      then: TORCH commits the roster change, provisions its branch and clean worktree, exposes the identity to existing and restarted control-plane clients, and can start only that identity through a virtualized adapter
    - id: SCN-cli-fleet-evolution
      given: an installed Fleet and a file-backed proposed domain
      when: the manager proposes it and the owner separately approves, plans, and activates it through the public CLI
      then: missing approval is refused and the activated identity is queryable through the ordinary Fleet CLI
    - id: SCN-product-site
      given: the redesigned TORCH public surface
      when: its product story and local-console boundary are inspected
      then: it explains project-derived fleets, exact-commit routing, honest open gates, and measured context claims without obsolete product language
    - id: SCN-console-readonly
      given: an installed Fleet without an initialized control-plane database
      when: the observation API and local HTTP console are requested
      then: fixed assets and structured state are served with restrictive headers while Git and machine-local state remain unchanged
    - id: SCN-context-locality
      given: measured provider usage and a separate heuristic estimate for one persistent Fleet identity
      when: CLI and identity-bound MCP record and aggregate the samples
      then: evidence classes stay separate, forged identities fail, and cache ratio plus cost per verified item are derived without calling zero-output usage efficient
    - id: SCN-schedule-boundaries
      given: system and session schedules with different owners, behavior, retries, and authority
      when: schedules are planned and executed through a virtualized shell-free runner
      then: offline sessions and unauthorized actors are blocked, mutation needs approval, failures retry exactly and notify durably, and each run is recorded
    - id: SCN-cli-schedules
      given: an installed Fleet with an active Session Manager and a read-only session schedule
      when: public CLI commands list, plan, and run it
      then: the same validated definition executes without shell interpretation and emits durable run evidence
  observable_outcomes:
    - Git status before and after read-only analysis
    - presence or absence of .torch and XDG-local project state
    - doctor health and finding codes
    - CLI exit status and structured error code
    - proposal review status, repository commit binding, and generated domain count
    - specification digest, evidence-linked responsibility, and stale-spec refusal
    - bootstrap trust boundary, unassigned components, unmatched specification signals, and pending output contract
    - provider plan isolation, explicit execution authority, parsed proposal, semantic findings, and retained pending review state
    - durable Fleet-change state, owner approval, configuration commit, clean worktree, prompt, live identity discovery, and isolated runtime start plan
    - compatibility report counts and unchanged COMBATRIG Git status
    - HTTP status, content-security policy, fixed routes, and traversal refusal
    - unchanged Git status and absent database before and after console observation
    - measured and estimated context groups, cache-read ratio, and cost per verified item
    - schedule plan blockers, subprocess shell flag, retry count, and durable failure message
    - preservation of project source and modified owner configuration
    - SQLite state after process restart
    - CLI and MCP output over real process boundaries
    - runtime command plans and execution order
    - local resume snapshot and presence transitions
    - immutable check receipt commit and result
    - resource holder, FIFO position, expiry, and cancellation state
    - canonical main SHA before and after authorized landing
    - Git remote configuration and recoverability grade
  determinism_controls:
    - isolated temporary Git repositories
    - fixed test Git identity
    - fixed installation timestamp where content is asserted
    - per-fixture XDG_DATA_HOME
    - injected UUID sequence and clock where ordering matters
    - virtualized Claude command runner with no provider calls
    - virtualized Codex command runner and deterministic JSONL events with no provider calls
    - local stdio MCP child process with bounded response timeout
    - deterministic backlog IDs, revisions, clocks, and injected integration lookup
    - shell-free fixture checks with controlled exit codes
    - injected resource clock and identifiers
    - local-only bare Git remote with no network dependency
    - isolated XDG version roots, synthetic artifacts, and injected acceptance results
    - injected post-pointer interruption with deterministic recovery timestamps
    - external temporary Markdown specification with no provider or network calls
    - synthetic COMBATRIG layout in an isolated temporary Git repository
    - loopback-only ephemeral HTTP server and fixed static route map
    - injected schedule executor, fixed clock, bounded retries, and no sleeps
  anti_cheat_rationale:
    prevents:
      - init that silently writes files
      - installer that overwrites existing state
      - doctor that reports healthy without required state
      - uninstall that deletes owner-modified configuration
      - CLI that mutates without explicit approval
      - in-memory-only messaging that disappears on restart
      - runtime session IDs masquerading as durable Fleet identities
      - messages or handoffs silently granting authority
      - workers creating tasks, changing owners, or completing work without a landed matching commit
      - concurrent backlog writers silently overwriting a newer task revision
      - management backlog files dirtying canonical main instead of the manager worktree
      - repository content redirecting machine-local database writes
      - MCP and CLI drifting onto separate business logic
      - launch plans that execute provider commands during preview
      - a mixed-runtime claim implemented as renamed Claude-only commands
      - lost Codex thread IDs or native steering that bypasses durable messaging
      - manager-first startup or manager-first shutdown
      - passing receipts detached from the commit actually measured
      - unfair or automatically stolen resource leases
      - integration based on branch labels, stale checks, or stale main
      - a same-disk bare repository mislabeled as off-machine recovery
      - a merely passing command being mislabeled as complete candidate acceptance
      - candidate staging silently replacing stable or accepted code changing before activation
      - interrupted pointer swaps leaving version metadata ambiguous
      - specifications being executed as instructions or changing after owner review
      - generic fleet templates replacing project-derived responsibilities
      - a code-layout heuristic being presented as AI architectural judgment
      - bootstrap silently calling a paid model or copying COMBATRIG domains
      - an architect provider inheriting project instructions, mutating the repository, inventing evidence, or approving its own organization
      - a worker expanding the roster or the Session Manager activating a domain without owner approval
      - transient one-off work causing silent unbounded Fleet growth
      - COMBATRIG compatibility inventing path ownership to force a green migration
      - a disconnected dashboard inventing state or creating it during observation
      - public copy claiming live qualification that only virtualized tests prove
      - estimated token counts being presented as provider measurements
      - low token use being called efficient without a verified outcome
      - schedule prose diverging from executable definitions or mutating without approval
  relaxation:
    did_relax_any_assertion: false
    if_true_explain_spec_basis: ""
