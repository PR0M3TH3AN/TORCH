{
  "schema": "torch.dev/v1alpha1",
  "project": {
    "id": "3dc11932-6e3c-42aa-9a8a-ca7b8f818b54",
    "name": "TORCH",
    "main_branch": "rewrite/portable-agent-fleet"
  },
  "paths": {
    "tracked_state": ".torch",
    "worktree_parent": "~/TORCHWorktrees"
  },
  "repository": {
    "canonical": {
      "type": "remote",
      "remote": "origin"
    }
  },
  "forge": {
    "provider": "none"
  },
  "git": {
    "branch_prefix": "torch/",
    "convergence": "merge",
    "allow_rebase": false,
    "allow_force_push": false,
    "allow_bare_stash": false
  },
  "synchronization": {
    "strategy": "dispatcher-managed",
    "auto_merge_worktrees": false
  },
  "runtimes": {
    "default": "codex",
    "codex": {
      "updatePolicy": { "mode": "auto", "max_age_hours": 24 },
      "model": "gpt-6-luna",
      "reasoning": "high",
      "launchPolicy": {
        "approval": "approve-for-me"
      }
    }
  },
  "checks": [
    {
      "id": "test",
      "title": "test",
      "command": "npm",
      "args": [
        "run",
        "test"
      ],
      "source": {
        "type": "package-script",
        "command": "node --test --test-timeout=60000 test/fleet/*.test.mjs"
      },
      "resources": [
        "browser"
      ]
    },
    {
      "id": "check",
      "title": "check",
      "command": "npm",
      "args": [
        "run",
        "check"
      ],
      "source": {
        "type": "package-script",
        "command": "node --check bin/torch.mjs && node --check src/cli.mjs && node --check src/mcp/server.mjs && node --check src/console/server.mjs && node --check src/artifacts/service.mjs && node --check src/adapters/plugins.mjs && node --check src/adapters/pi.mjs && node --check src/adapters/pi/extension.mjs && node --check site/app.js && node --check site/demo.js && node --check site/console.js && node --check site/work-views.js && node --check site/work-progress.js"
      },
      "resources": []
    },
    {
      "id": "test-dashboard",
      "title": "test:dashboard",
      "command": "npm",
      "args": [
        "run",
        "test:dashboard"
      ],
      "source": {
        "type": "package-script",
        "command": "node scripts/test-dashboard-demo.mjs"
      },
      "resources": [
        "browser"
      ]
    },
    {
      "id": "lint",
      "title": "lint",
      "command": "npm",
      "args": [
        "run",
        "lint"
      ],
      "source": {
        "type": "package-script",
        "command": "eslint src/adapters src/artifacts src/backlog src/canonical src/checks src/console src/convergence src/control-plane src/delivery src/design src/evolution src/forge src/importers src/integration src/kernel src/mcp src/observability src/resources src/runtime src/schedules src/self-host src/telemetry src/cli.mjs bin/torch.mjs site/*.js test/fleet"
      },
      "resources": []
    }
  ],
  "backlog": {
    "self_claim": {
      "enabled": false,
      "areas": []
    }
  },
  "resources": [
    {
      "id": "browser",
      "capacity": 1,
      "queue": "fifo",
      "max_hold_seconds": 3600
    }
  ],
  "schedules": [
    {
      "id": "session-manager-check-in",
      "title": "Session Manager direct-report check-in",
      "owner": "session-manager",
      "lifetime": "system",
      "trigger": {
        "type": "interval",
        "seconds": 3600
      },
      "behavior": "coordination",
      "action": {
        "type": "manager-check-in",
        "manager_id": "session-manager",
        "wake": { "enabled": false, "budget_mode": "invocation-count" }
      },
      "required_authority": [
        "owner"
      ],
      "retry": {
        "max_attempts": 1
      },
      "failure_recipient": "session-manager",
      "source_of_truth": "active organization direct-report graph"
    }
  ],
  "runtime_wake_budget": { "max_invocations_per_day": 12 },
  "integration": {
    "provider": "torch",
    "target": "rewrite/portable-agent-fleet",
    "require_current_main": true,
    "required_checks": [
      "test",
      "check",
      "test-dashboard",
      "lint"
    ],
    "landing_authority": [
      "session-manager"
    ]
  },
  "delivery": {
    "authority": {
      "implemented": [
        "$source"
      ],
      "verified": [
        "$source",
        "session-manager"
      ],
      "integrated": [
        "session-manager"
      ],
      "release_ready": [
        "session-manager"
      ],
      "released": [
        "owner"
      ],
      "deployed": [
        "owner"
      ],
      "live_verified": [
        "owner"
      ]
    },
    "adapters": {
      "release": {
        "provider": "none"
      },
      "deployment": {
        "provider": "none"
      }
    }
  },
  "session_manager": {
    "id": "session-manager",
    "runtime": "codex",
    "model": "gpt-6.1-sol",
    "reasoning": "high",
    "branch": null,
    "worktree_name": null
